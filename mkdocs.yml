site_name: Jev Gateway
site_description: >-
  自托管的 Jev / System One 兼容决策网关：在任何兼容 OpenAI 协议的服务上运行决策层，
  并扩展出本地图片输入。
site_author: jermeyhu
site_url: https://jermeyhu.github.io/jev-gateway/
repo_url: https://github.com/jermeyhu/jev-gateway
repo_name: jermeyhu/jev-gateway
edit_uri: edit/main/docs/
copyright: Apache-2.0 licensed &mdash; modelled on David-Lolly/Jev-Compatible

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jermeyhu/jev-gateway
      name: Source code on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/jev-gateway/
      name: Package on PyPI
    - icon: fontawesome/solid/globe
      link: https://github.com/David-Lolly/Jev-Compatible
      name: Reference implementation

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
          site_name: Jev Gateway
        - locale: en
          name: English
          build: true
          site_name: Jev Gateway
          nav_translations:
            首页: Home
            快速开始: Quick start
            工作方式: How it works
            接口参考: API reference
            配置参考: Configuration
            后端: Backends
            图片: Images
            脚本: Scripts
            限制与 FAQ: Limits & FAQ
            开发: Development

nav:
  - 首页: index.md
  - 快速开始: quick-start.md
  - 工作方式: how-it-works.md
  - 接口参考: api.md
  - 配置参考: configuration.md
  - 后端: backends.md
  - 图片: images.md
  - 脚本: scripts.md
  - 限制与 FAQ: limits.md
  - 开发: development.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
