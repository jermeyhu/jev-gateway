[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-gateway"
version = "0.1.0"
description = "Jev / System One compatible decision gateway over any OpenAI-compatible server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "jermeyhu" }]
keywords = [
  "jev",
  "system-one",
  "gateway",
  "llm",
  "classification",
  "logprobs",
  "openai-compatible",
  "llama-cpp",
  "vllm",
  "sglang",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
jev-gateway = "app.__main__:main"

[project.urls]
Homepage = "https://jermeyhu.github.io/jev-gateway/"
Documentation = "https://jermeyhu.github.io/jev-gateway/"
Repository = "https://github.com/jermeyhu/jev-gateway"
Issues = "https://github.com/jermeyhu/jev-gateway/issues"
Changelog = "https://github.com/jermeyhu/jev-gateway/releases"

[tool.setuptools]
packages = ["app", "app.backends", "app.decision", "app.primitives", "app.schemas", "app.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
